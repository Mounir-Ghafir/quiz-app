<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header id="app-header">
        <h1>Quiz Interactif</h1>
        <p>Testez vos connaissances avec nos quiz thématiques !</p>
        <h2>Choisissez une catégorie</h2>
    </header>
    <div id="categories-container">
        <button id="Informatique" class="choise">Informatique</button>
        <button id="Sciences" class="choise">Sciences</button>
        <button id="Géographie" class="choise">Géographie</button>
        <button id="Histoire" class="choise">Histoire</button>
    </div>
    <div id="question-show"></div>
    <div id="points-show"></div>
    <footer id="app-footer">
        <h2>Instructions</h2>
        <P>Choisissez une catégorie de quiz</P>
        <P>Répondez aux questions en sélectionnant une option</P>
        <P>Vous avez 30 secondes par question</P>
        <P>Consultez vos résultats à la fin du quiz</P>
    </footer>
    <script src="index.js"></script>
</body>
</html>
